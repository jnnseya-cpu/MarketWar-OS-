# THE GATE. Nothing reaches `main` without passing this.
#
# LAUNCH-AUDIT FINDING D-02 (P1). Before this file, the only workflow in the
# repository pushed secrets to Secret Manager. Nothing ran the type checker, the
# tests, the build or the dependency audit on any push or pull request — so
# "1,634 tests pass" was true only because somebody had just run them by hand,
# and stayed true only until the next commit. A test suite that does not gate a
# merge is documentation, not a control.
#
# The audit's Gate 1 asks that the release be traceable to a reviewed commit and
# that automated tests execute successfully. Both were failing on the second
# clause: they executed, but nothing required them to.
#
# WHAT RUNS, AND WHY EACH ONE IS HERE:
#   layers/casts  — this repository's own two invariants. `check-layers` keeps
#                   backend code out of the browser bundle; `check-casts` stops
#                   new `as` assertions on data that crossed a network boundary.
#                   Both are cheap and both have caught real defects.
#   typecheck     — `strict: true`, and the build alone does not fail on every
#                   type error in test/script files.
#   test          — 1,636 cases, no network, no keys.
#   build         — a production build is the only proof the app compiles as it
#                   will be served, not as it runs in dev.
#   audit         — fails on HIGH or CRITICAL. Moderate is reported and allowed:
#                   the uuid → firebase-admin chain is left deliberately (npm's
#                   "fix" is a four-major downgrade of firebase-admin) and a
#                   permanently red pipeline teaches people to ignore it.
#   secret scan   — a credential in a commit is unrecoverable once pushed.
#
# NOT HERE ON PURPOSE: nothing that needs a credential. This workflow must pass
# on a fork with no secrets, or it stops being a gate and becomes a bottleneck.

name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `ci`, not `install` — the lockfile is the contract. An install that
      # silently resolves a different tree is a build you did not test.
      - name: Install (locked)
        run: npm ci

      - name: Layer separation
        run: npm run check:layers

      - name: Cast guard
        run: npm run check:casts

      # The chart palette claimed to be CVD-optimised for months while three of
      # its eight series merged under deuteranopia. A claim nothing re-runs is
      # not a property, so it runs here.
      - name: Chart palette (contrast + colour-blind separation)
        run: npm run check:palette

      # A theme is ~150 numbers. The first light build put pale-on-pale warning
      # text at 1.5:1 and looked fine in every screenshot I happened to take.
      - name: Theme contrast (both themes, real class pairs)
        run: npm run check:contrast

      # EVERY GATE, NOT THE ONES SOMEBODY REMEMBERED.
      #
      # This workflow ran five of the twelve `check:*` scripts for weeks. The
      # other seven — the data register, route exposure, module-level key reads,
      # Firestore indexes, orphan modules, dead controls and the delivered-surface
      # lock — existed, passed locally, and were never run by anything that could
      # block a merge. A gate nothing runs is a comment.
      #
      # `tests/gate-wall.test.mjs` now fails if a `check:*` script exists in
      # package.json and is missing from this file or from `npm run verify`, so
      # the next gate cannot be added and forgotten.
      - name: Orphan modules
        run: npm run check:orphans

      - name: Route exposure
        run: npm run check:exposure

      - name: Data register completeness
        run: npm run check:register

      - name: Credential reads at module level
        run: npm run check:key-reads

      - name: Firestore composite indexes
        run: npm run check:indexes

      - name: Dead controls
        run: npm run check:controls

      # NOTHING SILENTLY CHANGES OR DROPS. Compares the delivered surface —
      # routes, pages, modules, agents, engines, the data register, the env
      # catalogue, the Stripe event lists, every plan price and every pricing
      # law — against docs/DELIVERED.lock.json. Additions pass; a removal or a
      # changed number fails and names itself.
      - name: Delivered-surface lock
        run: npm run check:lock

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # THE BEHAVIOURAL PROOF, RE-RUN. Fourteen hermetic drivers exercise the
      # real route handlers, the real wallet and stand-in providers. They were
      # the strongest evidence in the repository and the only evidence nothing
      # re-ran — so three of them had already rotted into a stack trace (a
      # missing key, a server that was not started) and one carried a check that
      # passed only when two timestamps landed in the same millisecond. The
      # first automated sweep found all four. It runs AFTER the build because
      # one of them audits the shipped pages.
      #
      # A driver passes only if it exits 0 AND reports "0 broken": exiting 0
      # while printing "1 broken" is the exact shape of a reported success that
      # never happened.
      - name: Drivers (behaviour re-proven)
        run: npm run verify:drivers

      # HIGH or CRITICAL fails the run. Moderate is printed for the record.
      #
      # A NEW ADVISORY LANDS WITHOUT ANYBODY TOUCHING THE CODE, and this step is
      # the one in the job that can go red on a commit that changed nothing. On
      # 09-06 two HIGH advisories were published against `browserslist` — a
      # transitive dependency of autoprefixer — and every run since had failed
      # here. Pinned forward in `overrides`; see the note there.
      # RUN THE GATE, NOT A SECOND COPY OF ITS RULE. This was a bare
      # `npm audit --audit-level=high`, while `scripts/check-advisories.mjs`
      # holds the same rule PLUS the record of advisories with no patched
      # version in the pinned line — so the gate and the workflow could
      # disagree, and the one that decided a merge was the one with less
      # information in it.
      - name: Dependency audit (high+, with the unfixable record)
        run: npm run check:advisories

      # Cheap, and the one class of mistake that cannot be undone by a revert.
      #
      # THIS FAILED EVERY RUN FROM THE DAY IT WAS WRITTEN, and on nothing. The
      # first pattern was `sk-[A-Za-z0-9_-]{20,}`, which matched the article slug
      # `ask-customers-for-reviews-properly` — the `sk-` is inside "**a**sk-", and
      # allowing `-` in the body let it run through the rest of the slug. Twelve
      # red runs, all of them this, none of them a credential.
      #
      # That is worse than an inconvenience: a scanner that cries wolf on every
      # commit is one whose red is ignored, which is the exact state this
      # repository was in. So the patterns now match the credentials as PROVIDERS
      # ACTUALLY ISSUE THEM:
      #   • a boundary before `sk-`, so a word ending in "ask"/"disk"/"risk" is not
      #     a prefix;
      #   • an alphanumeric body, because real key bodies are — the hyphens in a
      #     slug are what let the old pattern reach 20 characters at all;
      #   • `sk-proj-` named explicitly, since that separator is real.
      # Verified against both a real key shape and the slug that broke it before
      # this was committed.
      #
      # `always()`, AND IT IS NOT DEFENSIVENESS. Steps run in order and stop at
      # the first failure, so this sat BEHIND the dependency audit — and when a
      # new browserslist advisory turned that red on 09-06, the cheapest control
      # in the pipeline, guarding the one mistake a revert cannot undo, silently
      # stopped running on every push. A security check that is skipped whenever
      # something noisier fails is not a check; it is a check-shaped gap that
      # opens exactly when the pipeline is already unhappy.
      - name: Secret scan
        if: always()
        run: |
          set -o pipefail
          if git grep -nEI "((^|[^A-Za-z0-9_-])sk-(proj-)?[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{35}|whsec_[A-Za-z0-9]{24,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,})" \
               -- ':!tests/*' ':!docs/*' ':!.github/*' ; then
            echo "::error::A credential-shaped string is present in tracked source."
            exit 1
          fi
          echo "No credential-shaped strings outside tests/docs."

      # An .env that reaches the repository is a credential leak waiting for a
      # public clone. `.env.example` files are the intended, valueless form.
      - name: No .env committed
        if: always()
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.(local|production|development)$|/\.env$'; then
            echo "::error::An .env file is tracked. Remove it and rotate anything it held."
            exit 1
          fi
          echo "No .env files tracked."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BLOCKING. LAUNCH-AUDIT FINDING D-03: lint had never run here at all. Its
    # first pass found 139 errors — 137 of which were one false positive
    # repeated (a backend helper named `useDb()` read as a React hook) and are
    # now correctly scoped away. The remainder were fixed. It exits clean, so it
    # blocks: a check allowed to fail forever is the nothing it replaced.
    #
    # 63 warnings remain (unused vars, exhaustive-deps, <img>). Warnings do not
    # fail the run yet. Work them down, then add `--max-warnings 0`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
